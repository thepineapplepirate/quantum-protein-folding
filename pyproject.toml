[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tetrahedral-protein-folding"
version = "1.0.0"
description = "Qiskit 2.x implementation of the resource-efficient tetrahedral protein-folding model"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2,<2.3",
    "qiskit>=2.0,<2.5",
    "qiskit-aer>=0.17,<0.18",
    "qiskit-algorithms>=0.4,<0.5",
    "qiskit-ibm-runtime>=0.44,<0.45",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
]
dev = [
    "ddt>=1.7",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.flit.module]
name = "protein_folding"
